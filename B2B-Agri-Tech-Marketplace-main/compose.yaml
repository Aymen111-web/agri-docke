services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: agri_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-b2b_agri_tech}
      MYSQL_USER: ${DB_USERNAME:-agri_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agri_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Laravel 13 REST API Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agri_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-B2B Agri Tech Marketplace}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:oG8iYy5iGg1ZqN6pT4L8vW9rQ2eX0mY7uI3oP5sA1bC=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-b2b_agri_tech}"
      DB_USERNAME: "${DB_USERNAME:-agri_user}"
      DB_PASSWORD: "${DB_PASSWORD:-agri_secret}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      WAIT_FOR_DB: "true"
      AUTORUN_MIGRATIONS: "${AUTORUN_MIGRATIONS:-true}"
      AUTORUN_SEEDERS: "${AUTORUN_SEEDERS:-false}"
      CHAPA_SECRET_KEY: "${CHAPA_SECRET_KEY:-}"
      CHAPA_WEBHOOK_SECRET: "${CHAPA_WEBHOOK_SECRET:-}"
      CHAPA_CALLBACK_URL: "${CHAPA_CALLBACK_URL:-http://localhost:8080/api/payments/webhook}"
      CHAPA_RETURN_URL: "${CHAPA_RETURN_URL:-http://localhost:8080/payment/success}"
      SMS_ETHIOPIA_API_KEY: "${SMS_ETHIOPIA_API_KEY:-}"
      SMS_ETHIOPIA_BASE_URL: "${SMS_ETHIOPIA_BASE_URL:-https://smsethiopia.et/api}"
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - agri-network

  # Vue 3 Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    container_name: agri_frontend
    restart: unless-stopped
    networks:
      - agri-network

  # Nginx Reverse Proxy & Static Storage Ingress
  nginx:
    image: nginx:alpine
    container_name: agri_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agri-network

volumes:
  mysql_data:
    name: agri_mysql_data
  storage_data:
    name: agri_storage_data

networks:
  agri-network:
    name: agri_network
    driver: bridge

